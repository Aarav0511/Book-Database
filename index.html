<html>
    <head>
        <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" />
<link rel="stylesheet" href="https://bootswatch.com/4/yeti/bootstrap.min.css" />
    </head>
        <body>
   <div class="contaiiner mt-4">
    <h1 class="display-3 text-center">
<i class="fas fa-book-open" style="color: darkblue;"></i>
Books <span class="text-primary"> Database </span> List
    </h1>
   </div>     
       <form id="book-form">
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="title"
            class="form-control"/>
        </div>
        <div class="form-group">
            <label>Author</label>
            <input type="text"
            id="author" class="form-control" />
        </div>
        <div class="form-group">
            <label>Year Published</label>
            <input type="number"
            id="year" class="form-control" />
        </div>
        <input type="submit"
        value="Add a Book" class="btn- btn-primary btn-block" />
       </form>
       <table class="table table-striped mt-5">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody id="book-list">
        </tbody>
       </table>
       <script src="script.js"></script>
        </body>
</html>
